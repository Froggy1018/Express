<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="style.css">
    <title>Message Form</title>
</head>

<body>
    <form id="message-form">
        <label for="nickname">Nickname:</label><br>
        <input type="text" id="nickname" name="nickname" required placeholder="Your Nickname" maxlength="50"><br><br>

        <label for="message">Send a message to the world:</label><br>
        <textarea id="message" name="message" required placeholder="Your Message" maxlength="500" cols="30"></textarea><br><br>

        <button id="send" type="submit">Send Message</button>
    </form>

    <script src="script.js"></script>
    <script src="app.js"></script>
</body>

</html>
